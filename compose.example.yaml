# Example Docker Compose deployment for bambu-mqtt-proxy.
# Copy to compose.yaml, fill in your printers, then: docker compose up -d

services:
  bambu-mqtt-proxy:
    image: ghcr.io/bradsjm/bambu-mqtt-proxy:latest
    container_name: bambu-mqtt-proxy
    restart: unless-stopped
    ports:
      - "8883:8883" # MQTT (TLS) — point your apps here
      - "6000:6000" # raw camera (TLS) — camera apps authenticate with bblp + the printer's access code
      - "8080:8080" # HTTP: health + camera endpoints + camera wall
    environment:
      # One entry per printer, separated by ';'. Replace the placeholders.
      # name= sets an optional friendly camera wall label; MQTT routing always uses
      # the serial (the raw camera endpoint on 6000 routes by access code instead).
      # Camera support is auto-detected from the serial prefix (01P/01S/030/039).
      BMBPX_PRINTERS: >-
        serial=01P00A123456789,address=192.168.1.42:8883,tls=true,insecure_skip_verify=true,password=12345678,name=Garage P1S;
        serial=01S00C351100139,address=192.168.1.43:8883,tls=true,insecure_skip_verify=true,password=87654321
      # BMBPX_CAMERA_ENABLED: "false"  # disable camera endpoints, the camera wall, and the raw camera listener on 6000
      # BMBPX_OCTOEVERYWHERE_API_KEY: ""  # optional: enables OctoEverywhere Gadget AI failure detection
      # BMBPX_LOG_LEVEL: debug
    # Alternative: configure printers at http://<host>:8080/config instead of
    # BMBPX_PRINTERS. Remove BMBPX_PRINTERS above, then uncomment; saving
    # creates ./config/bambu-mqtt-proxy.yaml (the directory must be writable
    # by the container user):
    # volumes:
    #   - ./config:/config
