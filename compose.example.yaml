# Example Docker Compose deployment for bambu-mqtt-proxy.
# Copy to compose.yaml, then: docker compose up -d
# Open http://<host>:8080/config, add your printers, and save. The proxy
# writes ./config/bambu-mqtt-proxy.yaml and restarts itself.

services:
  bambu-mqtt-proxy:
    image: ghcr.io/bradsjm/bambu-mqtt-proxy:latest
    container_name: bambu-mqtt-proxy
    restart: unless-stopped
    ports:
      - "8883:8883" # MQTT (TLS) — point your apps here
      - "6000:6000" # raw camera (TLS) — camera apps authenticate with bblp + the printer's access code
      - "8080:8080" # HTTP: health, /config, camera endpoints, camera wall
    volumes:
      # Mount the directory, not the file. A save replaces the config file
      # atomically, and a single-file mount cannot be replaced. The directory
      # must be writable by the container user. To start from a file, copy
      # config.example.yaml to ./config/bambu-mqtt-proxy.yaml and edit it.
      - ./config:/config
    # Only two environment variables exist: BMBPX_HTTP_PORT overrides http.port
    # and BMBPX_LOG_LEVEL overrides log.level in the YAML file. To use one:
    # environment:
    #   BMBPX_LOG_LEVEL: debug
