<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bambu-mqtt-proxy cameras</title>
<style>
  :root { color-scheme: dark; --bg:#101214; --card:#191d21; --line:#2a3138;
          --text:#e8edf2; --dim:#9fb0bf; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: .6rem;
           padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header span { color: var(--dim); font-size: .8rem; }
  main { display: grid; gap: 1rem; padding: 1rem;
         grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .tile { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .cam { position: relative; aspect-ratio: 16/9; background: #000; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%;
             object-fit: contain; }
  .cam .msg { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; color: var(--dim); font-size: .85rem; }
  .info { padding: .6rem .75rem; display: grid; gap: .3rem; }
  .row { display: flex; justify-content: space-between; gap: .75rem; }
  .name { font-weight: 600; }
  .sub { color: var(--dim); font-size: .8rem; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: #0a0c0e; overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .6s; }
  .temps { display: flex; flex-wrap: wrap; gap: .4rem .9rem; color: var(--dim); font-size: .8rem; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:.75rem;
             padding:.5rem 1rem; border-bottom:1px solid var(--line); color:var(--dim); font-size:.8rem; }
  .settings { display:flex; align-items:center; flex-wrap:wrap; gap:.75rem; }
  .settings label { display:flex; align-items:center; gap:.35rem; }
  .settings input,.settings select { color:var(--text); background:var(--card); border:1px solid var(--line);
                                     border-radius:5px; padding:.25rem .35rem; }
  .settings input { width:4.2rem; }
  .status-chip,.mode-chip { position:absolute; top:.5rem; padding:.15rem .4rem; border-radius:4px;
                            text-transform:uppercase; letter-spacing:.04em; font-size:.62rem; font-weight:700; }
  .status-chip { left:.5rem; background:rgba(30,35,40,.8); color:var(--text); }
  .status-chip.printing { background:rgba(74,222,128,.9); color:#07150d; }
  .status-chip.paused { background:rgba(251,191,36,.9); color:#171000; }
  .status-chip.finished { background:rgba(56,189,248,.88); color:#03131b; }
  .status-chip.error { background:rgba(248,113,113,.92); color:#1c0808; }
  .mode-chip { right:.5rem; background:rgba(30,35,40,.8); color:var(--dim); }
  .mode-chip.live { background:rgba(248,113,113,.9); color:#180808; }
  .mode-chip.snapshot { background:rgba(251,191,36,.9); color:#171000; }
  .mode-chip.paused { background:rgba(90,99,108,.8); color:var(--text); }
  .bottom { position:absolute; inset:auto 0 0; padding:1.2rem .65rem .55rem;
            background:linear-gradient(transparent,rgba(0,0,0,.85)); color:var(--text); }
  .printer-label { font-size:.74rem; font-weight:650; white-space:nowrap;
                   text-overflow:ellipsis; overflow:hidden; }
  .bottom .filename { font-size:.74rem; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
  .bottom .details { color:var(--dim); font-size:.68rem; display:flex; gap:.6rem; flex-wrap:wrap; }
  .cam .msg { z-index:1; text-align:center; padding:1rem; }
  .cam img { z-index:0; }
  .cam .status-chip,.cam .mode-chip,.cam .bottom { z-index:2; }
  #empty { margin:2rem 1rem; padding:2rem; border:1px dashed var(--line); border-radius:8px;
           color:var(--dim); text-align:center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: .35rem; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
</style>
</head>
<body>
<header><h1>bambu-mqtt-proxy</h1><span id="updated"></span></header>
<section class="toolbar">
  <span id="summary">Loading printer cameras…</span>
  <div class="settings" id="settings">
    <label>Live <input id="max-live" type="number" min="1" max="16" value="4" title="Maximum simultaneous live streams"></label>
    <label>Snapshot s <input id="snapshot-interval" type="number" min="2" max="60" value="8" title="Snapshot refresh interval"></label>
    <label>Status <select id="status-mode" title="Status overlay"><option value="off">Off</option><option value="compact" selected>Compact</option><option value="full">Full</option></select></label>
  </div>
</section>
<main id="grid"></main>
<div id="empty" hidden>No printers configured. Add printer serials to the proxy config.</div>
<script>
"use strict";
const STATUS_POLL_MS = 5000;
const SNAPSHOT_TICK_MS = 1000;
const DEFAULT_MAX_LIVE = 4;
const DEFAULT_SNAPSHOT_SEC = 8;
const MIN_MAX_LIVE = 1, MAX_MAX_LIVE = 16;
const MIN_SNAPSHOT_SEC = 2, MAX_SNAPSHOT_SEC = 60;
let inFlight = false;
let liveSlots = new Set();
let snapshotSlots = new Set();
let visibilityObserver;
let visibleSerials = new Set();
let wallPrinters = [];
const params = new URLSearchParams(location.search);

function clamp(n, min, max) { return Math.min(max, Math.max(min, Number(n) || min)); }
function readSetting(param, key, fallback, min, max) {
  const raw = params.has(param) ? params.get(param) : localStorage.getItem(key);
  return clamp(raw == null ? fallback : raw, min, max);
}
let maxLive = readSetting("maxLive", "camWallMaxLive", DEFAULT_MAX_LIVE, MIN_MAX_LIVE, MAX_MAX_LIVE);
let snapshotInterval = readSetting("interval", "camWallSnapshotSec", DEFAULT_SNAPSHOT_SEC, MIN_SNAPSHOT_SEC, MAX_SNAPSHOT_SEC);
let statusMode = params.get("status") || localStorage.getItem("camWallStatusMode") || "compact";
if (!['off','compact','full'].includes(statusMode)) statusMode = "compact";
document.getElementById("max-live").value = maxLive;
document.getElementById("snapshot-interval").value = snapshotInterval;
document.getElementById("status-mode").value = statusMode;

document.getElementById("max-live").addEventListener("change", (e) => {
  maxLive = clamp(e.target.value, MIN_MAX_LIVE, MAX_MAX_LIVE);
  e.target.value = maxLive;
  localStorage.setItem("camWallMaxLive", String(maxLive));
  updateModes();
});
document.getElementById("snapshot-interval").addEventListener("change", (e) => {
  snapshotInterval = clamp(e.target.value, MIN_SNAPSHOT_SEC, MAX_SNAPSHOT_SEC);
  e.target.value = snapshotInterval;
  localStorage.setItem("camWallSnapshotSec", String(snapshotInterval));
  poll();
});
document.getElementById("status-mode").addEventListener("change", (e) => {
  statusMode = ['off','compact','full'].includes(e.target.value) ? e.target.value : "compact";
  localStorage.setItem("camWallStatusMode", statusMode);
  for (const p of wallPrinters) {
    const tile = document.querySelector(`[data-serial="${CSS.escape(p.serial)}"]`);
    if (tile) update(tile, p);
  }
});

function fmtTemp(c, t) {
  if (c == null) return "";
  return t != null && Math.abs(t - c) > 0.5 ? `${Math.round(c)} / ${Math.round(t)}°` : `${Math.round(c)}°`;
}
function fmtTime(min) {
  if (!min || min <= 0) return "";
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
function statusBucket(p) {
  const s = (p.state || "").toUpperCase();
  if (s === "RUNNING") return ["printing", "ok"];
  if (s === "PAUSE") return ["paused", "warn"];
  if (s === "FINISH") return ["finished", "bad"];
  if (s === "FAILED") return ["error", "bad"];
  return [(p.connected ? "idle" : "offline"), ""];
}

function render(p) {
  const tile = document.createElement("div");
  tile.className = "tile"; tile.dataset.serial = p.serial;
  tile.innerHTML = `
    <div class="cam"><img alt="" hidden><div class="msg"></div>
      <span class="status-chip" hidden></span><span class="mode-chip"></span>
      <div class="bottom"><div class="printer-label"></div><div class="filename" hidden></div><div class="details" hidden></div></div>
    </div>
    <div class="info">
      <div class="row"><span class="name"></span><span class="sub state"></span></div>
      <div class="file-block"><div class="sub file"></div>
        <div class="bar"><div></div></div>
        <div class="row"><span class="sub layers"></span><span class="sub remain"></span></div>
        <div class="temps"></div></div>
    </div>`;
  const img = tile.querySelector("img");
  img.addEventListener("load", settleSnapshot);
  img.addEventListener("error", () => {
    if (img.dataset.mode === "snapshot") img.dataset.pending = "false";
    else img.dataset.mode = "error";
    img.hidden = true;
    tile.querySelector(".msg").textContent = "camera unavailable — retrying";
  });
  update(tile, p);
  return tile;
}

function update(tile, p) {
  const mode = p.mode || "paused";
  tile.dataset.mode = mode;
  tile.dataset.statusMode = statusMode;
  const visible = visibleSerials.has(p.serial);
  const status = tile.querySelector(".state");
  const chip = tile.querySelector(".status-chip");
  const modeChip = tile.querySelector(".mode-chip");
  const bottom = tile.querySelector(".bottom");
  const fileBlock = tile.querySelector(".file-block");

  tile.querySelector(".name").textContent = p.model ? `${p.serial} · ${p.model}` : p.serial;
  const [label, cls] = statusBucket(p);
  status.textContent = label;
  const dot = document.createElement("span");
  dot.className = "dot " + cls;
  status.prepend(dot);
  const showChip = p.connected && statusMode !== "off" && !["idle","offline"].includes(label);
  chip.hidden = !showChip;
  chip.textContent = label;
  chip.className = `status-chip ${label}`;

  tile.querySelector(".file").textContent = p.filename || "";
  tile.querySelector(".bar > div").style.width = `${Math.round(p.progress || 0)}%`;
  tile.querySelector(".layers").textContent =
    p.layer_num != null && p.total_layers ? `layer ${p.layer_num}/${p.total_layers}` : "";
  tile.querySelector(".remain").textContent = fmtTime(p.remain_min);

  const temps = tile.querySelector(".temps");
  temps.replaceChildren();
  const addTemp = (label, cur, target) => {
    if (cur == null) return;
    const el = document.createElement("span");
    el.textContent = `${label} ${fmtTemp(cur, target)}`;
    temps.appendChild(el);
  };
  addTemp("nozzle", p.nozzle_temp, p.nozzle_target);
  addTemp("bed", p.bed_temp, p.bed_target);
  addTemp("chamber", p.chamber_temp, null);

  modeChip.textContent = mode === "live" ? "LIVE" : mode === "snapshot" ? "SNAP" : "OFF";
  modeChip.className = `mode-chip ${mode}`;
  tile.querySelector(".printer-label").textContent = p.model ? `${p.serial} · ${p.model}` : p.serial;
  const printing = ["RUNNING","PAUSE"].includes((p.state || "").toUpperCase());
  const fullInfo = statusMode === "full" && printing;
  bottom.hidden = statusMode === "off";
  tile.querySelector(".filename").textContent = p.filename || "";
  tile.querySelector(".filename").hidden = !fullInfo || !p.filename;
  const details = tile.querySelector(".details");
  details.hidden = !fullInfo;
  details.textContent = fullInfo ? [
    p.progress != null ? `${Math.round(p.progress)}%` : "",
    p.layer_num != null && p.total_layers ? `layer ${p.layer_num}/${p.total_layers}` : "",
    fmtTime(p.remain_min),
  ].filter(Boolean).join(" · ") : "";
  tile.querySelector(".bar").hidden = statusMode !== "full" || !printing;
  tile.querySelector(".layers").hidden = statusMode !== "full";
  tile.querySelector(".remain").hidden = statusMode !== "full";
  tile.querySelector(".temps").hidden = statusMode !== "full";
  fileBlock.hidden = statusMode !== "full";

  // Camera pane: unsupported models never request images at all.
  const img = tile.querySelector("img");
  const msg = tile.querySelector(".msg");
  if (!p.camera_supported) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "camera unsupported on this model";
    return;
  }
  if (!p.connected) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "printer offline";
    return;
  }
  if (!visible) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "";
    return;
  }
  if (liveSlots.has(p.serial)) {
    img.hidden = false;
    if (img.dataset.mode !== "live" || !img.src.includes(p.serial)) {
      img.dataset.pending = "false";
      img.dataset.mode = "live";
      img.src = `/camera/${encodeURIComponent(p.serial)}/stream`;
    }
    msg.textContent = "";
    return;
  }
  if (!snapshotSlots.has(p.serial)) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "";
    return;
  }
  img.hidden = false;
  msg.textContent = "";
  // Fetch immediately when a tile enters snapshot mode. A separate timer
  // refreshes snapshots at the configured interval, independent of status
  // polling cadence.
  const sameSnapshot = img.dataset.mode === "snapshot" && img.dataset.serial === p.serial;
  if (sameSnapshot) return;
  requestSnapshot(img, p.serial);
}

// requestSnapshot fetches one frame and prevents overlapping tile captures.
function requestSnapshot(img, serial) {
  if (img.dataset.pending === "true") return;
  img.hidden = false;
  img.closest(".cam").querySelector(".msg").textContent = "";
  img.dataset.mode = "snapshot";
  img.dataset.serial = serial;
  img.dataset.pending = "true";
  const bust = Date.now();
  img.dataset.bust = String(bust);
  img.src = `/camera/${encodeURIComponent(serial)}/snapshot?t=${bust}`;
}

// pauseImage releases the MJPEG connection when a tile leaves the live set.
function pauseImage(img) {
  if (img.dataset.mode !== "paused") img.removeAttribute("src");
  img.dataset.mode = "paused";
  img.dataset.serial = "";
  img.dataset.pending = "false";
}

// refreshSnapshots honors the configured cadence without refreshing printer
// state or restarting any live stream.
function refreshSnapshots() {
  const now = Date.now();
  for (const serial of snapshotSlots) {
    const tile = document.querySelector(`[data-serial="${CSS.escape(serial)}"]`);
    const img = tile?.querySelector("img");
    if (!img || img.dataset.mode !== "snapshot" || img.dataset.pending === "true") continue;
    if (now - Number(img.dataset.bust || 0) >= snapshotInterval * 1000) requestSnapshot(img, serial);
  }
}

// Browser image events release the pending marker so the next interval can
// request another frame or retry a failed snapshot.
function settleSnapshot(event) {
  const img = event.currentTarget;
  if (img.dataset.mode === "snapshot") img.dataset.pending = "false";
}

function updateModes() {
  let liveBudget = maxLive;
  liveSlots = new Set();
  snapshotSlots = new Set();
  for (const p of wallPrinters) {
    p.mode = "paused";
    if (!visibleSerials.has(p.serial) || !p.connected || !p.camera_supported) continue;
    if (liveBudget > 0) {
      p.mode = "live";
      liveSlots.add(p.serial);
      liveBudget--;
    } else {
      p.mode = "snapshot";
      snapshotSlots.add(p.serial);
    }
  }
  for (const p of wallPrinters) {
    const tile = document.querySelector(`[data-serial="${CSS.escape(p.serial)}"]`);
    if (tile) update(tile, p);
  }
  const live = wallPrinters.filter(p => p.mode === "live").length;
  const snap = wallPrinters.filter(p => p.mode === "snapshot").length;
  document.getElementById("summary").textContent = wallPrinters.length === 0
    ? "No printers configured"
    : `${live} live · ${snap} snapshots · ${wallPrinters.length} printers`;
}

function observeTiles() {
  if (visibilityObserver) visibilityObserver.disconnect();
  visibleSerials = new Set();
  if (!("IntersectionObserver" in window)) {
    for (const p of wallPrinters) visibleSerials.add(p.serial);
    updateModes();
    return;
  }
  visibilityObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const serial = entry.target.dataset.serial;
      if (!serial) continue;
      if (entry.isIntersecting) visibleSerials.add(serial);
      else visibleSerials.delete(serial);
    }
    updateModes();
  }, { threshold: 0.4 });
  document.querySelectorAll(".tile").forEach(tile => visibilityObserver.observe(tile));
}

async function poll() {
  if (inFlight) return;              // never overlap status requests
  inFlight = true;
  try {
    const res = await fetch("/camera/status", { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString();

    const grid = document.getElementById("grid");
    const printers = data.printers || [];
    wallPrinters = printers;
    grid.hidden = printers.length === 0;
    document.getElementById("empty").hidden = printers.length !== 0;

    const bySerial = new Map(printers.map(p => [p.serial, p]));
    let added = false;
    let removed = false;
    for (const el of [...grid.children]) {
      if (!bySerial.has(el.dataset.serial)) {
        visibilityObserver?.unobserve(el);
        visibleSerials.delete(el.dataset.serial);
        el.remove();
        removed = true;
      }
    }
    for (const p of printers) {
      let el = grid.querySelector(`[data-serial="${CSS.escape(p.serial)}"]`);
      if (!el) { grid.appendChild(render(p)); added = true; continue; }
      // Update the existing tile in place so the <img> element survives
      // across polls: replacing it would abort and reopen live MJPEG
      // streams (and re-fetch snapshots) on every 2s cycle.
      update(el, p);
    }
    if (added || removed || !visibilityObserver) observeTiles();
    updateModes();
  } catch { /* transient network error: next tick retries */ }
  finally { inFlight = false; }
}

setInterval(poll, STATUS_POLL_MS);
setInterval(refreshSnapshots, SNAPSHOT_TICK_MS);
poll();
</script>
</body>
</html>
