<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bambu-mqtt-proxy cameras</title>
<style>
  :root { color-scheme: dark; --bg:#101214; --card:#191d21; --line:#2a3138;
          --text:#e8edf2; --dim:#9fb0bf; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: .6rem;
           padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header span { color: var(--dim); font-size: .8rem; }
  #updated { flex: 1 1 auto; }
  #request-error:not([hidden]) { display: block; padding: .45rem 1rem; color: var(--bad);
                                 border-bottom: 1px solid var(--line); }
  #request-error.recovered { color: var(--ok); }
  main:not([hidden]) { display: grid; gap: 1rem; padding: 1rem;
                       grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .tile { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .cam { position: relative; aspect-ratio: 16/9; background: #000; }
  .cam .camera-link { position: absolute; inset: 0; z-index: 0; }
  .cam .camera-link:not([hidden]) { display: block; }
  .cam .camera-link:focus-visible { outline: 2px solid var(--warn); outline-offset: -3px; z-index: 3; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%;
             object-fit: contain; z-index: 0; }
  .cam .msg { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; color: var(--dim); font-size: .85rem;
              z-index: 1; text-align: center; padding: 1rem; pointer-events: none; }
  .tile[data-mode="offline"] .cam,
  .tile[data-mode="unsupported"] .cam { background: #090b0d; }
  .tile[data-mode="offline"] .msg,
  .tile[data-mode="unsupported"] .msg { color: #c0cbd4; }
  .info { padding: .6rem .75rem; display: grid; gap: .3rem; }
  .row { display: flex; justify-content: space-between; gap: .75rem; }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          font-weight: 600; }
  .sub { color: var(--dim); font-size: .8rem; overflow: hidden;
         text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; background: #0a0c0e; overflow: hidden; }
  .bar > div { height: 100%; background: var(--ok); width: 0; transition: width .6s; }
  .temps { display: flex; flex-wrap: wrap; gap: .4rem .9rem; color: var(--dim); font-size: .8rem; }
  .toolbar { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:.75rem;
             padding:.5rem 1rem; border-bottom:1px solid var(--line); color:var(--dim); font-size:.8rem; }
  #summary { flex: 1 1 12rem; }
  .settings { display:flex; align-items:center; flex-wrap:wrap; gap:.75rem; }
  .settings label { display:flex; align-items:center; gap:.35rem; }
  .settings input,.settings select { color:var(--text); background:var(--card); border:1px solid var(--line);
                                     border-radius:5px; padding:.25rem .35rem; }
  .settings input { width:4.2rem; }
  .status-chip,.mode-chip { position:absolute; top:.5rem; padding:.15rem .4rem; border-radius:4px;
                            text-transform:uppercase; letter-spacing:.04em; font-size:.62rem; font-weight:700; }
  .status-chip { left:.5rem; background:rgba(30,35,40,.8); color:var(--text); }
  .status-chip.printing { background:rgba(74,222,128,.9); color:#07150d; }
  .status-chip.paused { background:rgba(251,191,36,.9); color:#171000; }
  .status-chip.preparing { background:rgba(251,191,36,.9); color:#171000; }
  .status-chip.finished { background:rgba(56,189,248,.88); color:#03131b; }
  .status-chip.error { background:rgba(248,113,113,.92); color:#1c0808; }
  .mode-chip { right:.5rem; background:rgba(30,35,40,.8); color:var(--dim); }
  .mode-chip.live { background:rgba(248,113,113,.9); color:#180808; }
  .mode-chip.snapshot { background:rgba(251,191,36,.9); color:#171000; }
  .mode-chip.paused { background:rgba(90,99,108,.8); color:var(--text); }
  .status-chip,.mode-chip { pointer-events:none; }
  .frame-state { font-size:.75rem; overflow:visible; text-overflow:clip;
                 white-space:normal; overflow-wrap:anywhere; }
  .frame-state.stale { color:var(--warn); }
  .frame-state.unknown { color:var(--dim); }
  .cam .status-chip,.cam .mode-chip { z-index:2; }
  #empty { margin:2rem 1rem; padding:2rem; border:1px dashed var(--line); border-radius:8px;
           color:var(--dim); text-align:center; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: .35rem; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); } .dot.finished { background: #38bdf8; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
             overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  body.kiosk header, body.kiosk .toolbar { display:none; }
  @media (max-width: 360px) {
    main { gap:.65rem; padding:.65rem; }
    .toolbar { padding:.5rem .65rem; }
    .settings { gap:.45rem; }
  }
</style>
</head>
<body>
<header><h1>bambu-mqtt-proxy</h1><span id="updated" aria-live="off">Last successful update: not yet</span></header>
<div id="request-error" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<section class="toolbar">
  <span id="summary" aria-live="polite" aria-atomic="true">Loading printer cameras…</span>
  <div class="settings" id="settings">
    <label>Live <input id="max-live" type="number" min="1" max="16" value="4" title="Maximum simultaneous live streams"></label>
    <label>Snapshot refresh (s) <input id="snapshot-interval" type="number" min="2" max="60" value="8" title="Snapshot refresh interval in seconds"></label>
    <label>Status <select id="status-mode" title="Status overlay"><option value="off">Off</option><option value="compact" selected>Compact</option><option value="full">Full</option></select></label>
  </div>
</section>
<main id="grid"></main>
<div id="empty" hidden>No printers configured. Add printer serials to the proxy config.</div>
<span id="frame-age-help" class="sr-only">The age describes the backend's cached frame, not image delivery to this browser.</span>
<span id="new-tab-help" class="sr-only">Opens in a new tab.</span>
<script>
"use strict";
// Set polling cadence, defaults, and bounds for browser wall settings.
const STATUS_POLL_MS = 5000;
const SNAPSHOT_TICK_MS = 1000;
const DEFAULT_MAX_LIVE = 4;
const DEFAULT_SNAPSHOT_SEC = 8;
const MIN_MAX_LIVE = 1, MAX_MAX_LIVE = 16;
const MIN_SNAPSHOT_SEC = 2, MAX_SNAPSHOT_SEC = 60;
// Track camera allocation and visibility for the current wall.
let inFlight = false;
let liveSlots = new Set();
let snapshotSlots = new Set();
let visibilityObserver;
let visibleSerials = new Set();
let wallPrinters = [];
// URL parameters override browser-stored settings.
const params = new URLSearchParams(location.search);
// Keep the update label and one-time failure/recovery notice in sync.
let requestFailed = false;
let lastSuccessAt = null;
// Avoid repeating unchanged summaries in the live region.
let lastSummary = "";

// Save the selected value in this browser and preserve the rest of the current URL.
function saveSetting(param, key, value) {
  localStorage.setItem(key, String(value));
  const current = new URL(location.href);
  current.searchParams.set(param, String(value));
  history.replaceState(history.state, "", `${current.pathname}${current.search}${current.hash}`);
}

if (params.get("kiosk") === "1") document.body.classList.add("kiosk");

// Normalize setting values to their supported numeric range.
function clamp(n, min, max) { return Math.min(max, Math.max(min, Number(n) || min)); }

// Read each setting from the URL, browser storage, or its default.
function readSetting(param, key, fallback, min, max) {
  const raw = params.has(param) ? params.get(param) : localStorage.getItem(key);
  return clamp(raw == null ? fallback : raw, min, max);
}
// Store the active stream cap and snapshot refresh interval.
let maxLive = readSetting("maxLive", "camWallMaxLive", DEFAULT_MAX_LIVE, MIN_MAX_LIVE, MAX_MAX_LIVE);
let snapshotInterval = readSetting("interval", "camWallSnapshotSec", DEFAULT_SNAPSHOT_SEC, MIN_SNAPSHOT_SEC, MAX_SNAPSHOT_SEC);
// Select compact status by default while allowing status overlays to be disabled.
let statusMode = params.get("status") || localStorage.getItem("camWallStatusMode") || "compact";
if (!['off','compact','full'].includes(statusMode)) statusMode = "compact";
document.getElementById("max-live").value = maxLive;
document.getElementById("snapshot-interval").value = snapshotInterval;
document.getElementById("status-mode").value = statusMode;

document.getElementById("max-live").addEventListener("change", (e) => {
  maxLive = clamp(e.target.value, MIN_MAX_LIVE, MAX_MAX_LIVE);
  e.target.value = maxLive;
  saveSetting("maxLive", "camWallMaxLive", maxLive);
  updateModes();
});
document.getElementById("snapshot-interval").addEventListener("change", (e) => {
  snapshotInterval = clamp(e.target.value, MIN_SNAPSHOT_SEC, MAX_SNAPSHOT_SEC);
  e.target.value = snapshotInterval;
  saveSetting("interval", "camWallSnapshotSec", snapshotInterval);
  refreshSnapshots();
  updateTiles(wallPrinters);
});
document.getElementById("status-mode").addEventListener("change", (e) => {
  statusMode = ['off','compact','full'].includes(e.target.value) ? e.target.value : "compact";
  saveSetting("status", "camWallStatusMode", statusMode);
  updateTiles(wallPrinters);
});

// Format a current temperature and its target when they differ.
function fmtTemp(c, t) {
  if (c == null) return "";
  return t != null && t > 0 && Math.abs(t - c) > 0.5
    ? `${Math.round(c)} / ${Math.round(t)}°` : `${Math.round(c)}°`;
}
// Format remaining print time in minutes or hours and minutes.
function fmtTime(min) {
  if (!min || min <= 0) return "";
  const total = Math.round(min);
  const h = Math.floor(total / 60), m = total % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
// Map reported printer state to its visible label and color.
function statusBucket(p) {
  const s = (p.state || "").toUpperCase();
  if (!p.connected) return ["offline", ""];
  if (s === "RUNNING") return ["printing", "ok"];
  if (s === "PAUSE") return ["paused", "warn"];
  if (s === "PREPARE" || s === "SLICING") return ["preparing", "warn"];
  if (s === "FINISH") return ["finished", "finished"];
  if (s === "FAILED") return ["error", "bad"];
  return ["idle", ""];
}

// Create a stable tile node and attach image event handlers once.
function render(p) {
  const tile = document.createElement("div");
  tile.className = "tile"; tile.dataset.serial = p.serial;
  tile.innerHTML = `
    <div class="cam"><a class="camera-link" target="_blank" rel="noopener" hidden><img alt="" hidden></a><div class="msg"></div>
      <span class="status-chip" hidden></span><span class="mode-chip"></span>
    </div>
    <div class="info">
      <div class="row"><span class="name"></span><span class="sub state"></span></div>
      <div class="sub file" hidden></div>
      <div class="file-block">
        <div class="progress-label"></div>
        <div class="bar"><div></div></div>
        <div class="row"><span class="sub layers"></span><span class="sub remain"></span></div>
        <div class="temps"></div>
      </div>
      <div class="sub frame-state unknown" aria-describedby="frame-age-help"></div>
    </div>`;
  const img = tile.querySelector("img");
  img.addEventListener("load", settleSnapshot);
  img.addEventListener("error", () => {
    const msg = tile.querySelector(".msg");
    if (tile.dataset.mode === "offline" || tile.dataset.mode === "unsupported") {
      img.dataset.pending = "false";
      img.hidden = true;
      msg.textContent = tile.dataset.mode === "offline"
        ? "printer offline" : "camera unsupported on this model";
      return;
    }
    if (img.dataset.mode === "paused") return;
    if (img.dataset.mode === "snapshot") img.dataset.pending = "false";
    else img.dataset.mode = "error";
    if (img.dataset.mode === "snapshot") img.dataset.snapshotError = "true";
    img.hidden = true;
    msg.textContent = "camera unavailable — retrying";
  });
  update(tile, p);
  return tile;
}

// Render printer status, cached-frame age, and camera state into one tile.
function update(tile, p) {
  const mode = p.mode || "paused";
  tile.dataset.mode = mode;
  tile.dataset.statusMode = statusMode;
  const visible = visibleSerials.has(p.serial);
  const status = tile.querySelector(".state");
  const chip = tile.querySelector(".status-chip");
  const modeChip = tile.querySelector(".mode-chip");
  const fileBlock = tile.querySelector(".file-block");
  const isActive = ["RUNNING", "PAUSE"].includes((p.state || "").toUpperCase());

  tile.querySelector(".name").textContent = p.model ? `${p.serial} · ${p.model}` : p.serial;
  const [label, cls] = statusBucket(p);
  status.textContent = label;
  const dot = document.createElement("span");
  dot.className = "dot " + cls;
  dot.setAttribute("aria-hidden", "true");
  status.prepend(dot);
  const showChip = p.connected && statusMode !== "off" && !["idle","offline"].includes(label);
  chip.hidden = !showChip;
  chip.textContent = label;
  chip.className = `status-chip ${label}`;

  const file = tile.querySelector(".file");
  file.textContent = p.filename || "";
  const showPrintDetails = statusMode === "full";
  file.hidden = !showPrintDetails || !p.filename;
  const progress = Math.round(p.progress ?? 0);
  tile.querySelector(".bar > div").style.width = `${progress}%`;
  tile.querySelector(".layers").textContent =
    p.layer_num != null && p.total_layers ? `layer ${p.layer_num}/${p.total_layers}` : "";
  tile.querySelector(".remain").textContent = fmtTime(p.remain_min);

  const temps = tile.querySelector(".temps");
  temps.replaceChildren();
  const addTemp = (label, cur, target) => {
    if (cur == null) return;
    const el = document.createElement("span");
    el.textContent = `${label} ${fmtTemp(cur, target)}`;
    temps.appendChild(el);
  };
  addTemp("nozzle", p.nozzle_temp, p.nozzle_target);
  addTemp("bed", p.bed_temp, p.bed_target);
  addTemp("chamber", p.chamber_temp, null);

  modeChip.textContent = mode === "live" ? "LIVE" : mode === "snapshot" ? "SNAP"
    : mode === "offline" ? "OFFLINE" : mode === "unsupported" ? "UNSUPPORTED" : "PAUSED";
  modeChip.className = `mode-chip ${mode}`;
  modeChip.hidden = !p.camera_supported;
  tile.querySelector(".progress-label").textContent = isActive ? `${progress}%` : "";
  tile.querySelector(".bar").hidden = !isActive || !showPrintDetails;
  tile.querySelector(".bar").setAttribute("aria-label", `Print progress ${progress}%`);
  tile.querySelector(".layers").hidden = !showPrintDetails || !isActive;
  tile.querySelector(".remain").hidden = !showPrintDetails || !isActive;
  tile.querySelector(".temps").hidden = !showPrintDetails;
  fileBlock.hidden = !showPrintDetails;

  const frameState = tile.querySelector(".frame-state");
  frameState.hidden = !p.camera_supported;
  const hasFrame = p.frame_seq != null && Number(p.frame_seq) > 0;
  // The backend omits zero ages, so a frame sequence also marks a fresh frame.
  const frameAge = Number(p.frame_age_seconds ?? 0);
  frameState.className = "sub frame-state";
  if (!hasFrame || !Number.isFinite(frameAge)) {
    frameState.textContent = "No cached frame";
    frameState.classList.add("unknown");
  } else {
    const seconds = Math.max(0, Math.round(frameAge));
    const stale = seconds > snapshotInterval * 3;
    frameState.textContent = `Cached frame: ${seconds === 0 ? "just captured" : `${seconds}s old`}${stale ? " · stale" : ""} (last update)`;
    if (stale) frameState.classList.add("stale");
  }

  // Only the browser-selected live or snapshot mode loads an eligible camera image.
  const img = tile.querySelector("img");
  const cameraLink = tile.querySelector(".camera-link");
  const msg = tile.querySelector(".msg");
  cameraLink.href = `/camera/${encodeURIComponent(p.serial)}/stream`;
  cameraLink.setAttribute("aria-label", `Open live camera for ${p.serial}${p.model ? ` (${p.model})` : ""} in a new tab`);
  cameraLink.setAttribute("aria-describedby", "new-tab-help");
  cameraLink.hidden = !p.camera_supported;
  img.alt = `Camera view for ${p.serial}${p.model ? ` (${p.model})` : ""}`;
  if (!p.camera_supported) {
    pauseImage(img);
    img.hidden = true;
    cameraLink.hidden = true;
    tile.dataset.mode = "unsupported";
    msg.textContent = "camera unsupported on this model";
    return;
  }
  if (!p.connected) {
    pauseImage(img);
    img.hidden = true;
    tile.dataset.mode = "offline";
    msg.textContent = "printer offline";
    return;
  }
  if (!visible) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "";
    return;
  }
  if (liveSlots.has(p.serial)) {
    img.hidden = false;
    if (img.dataset.mode !== "live" || img.dataset.serial !== p.serial) {
      img.dataset.pending = "false";
      img.dataset.mode = "live";
      img.dataset.serial = p.serial;
      img.src = `/camera/${encodeURIComponent(p.serial)}/stream`;
    }
    msg.textContent = "";
    return;
  }
  if (!snapshotSlots.has(p.serial)) {
    pauseImage(img);
    img.hidden = true;
    msg.textContent = "";
    return;
  }
  img.hidden = false;
  // Fetch immediately when a tile enters snapshot mode. A separate timer
  // refreshes snapshots at the configured interval, independent of status
  // polling cadence.
  const sameSnapshot = img.dataset.mode === "snapshot" && img.dataset.serial === p.serial;
  if (sameSnapshot) {
    if (img.dataset.snapshotError === "true") img.hidden = true;
    else msg.textContent = "";
    return;
  }
  msg.textContent = "";
  requestSnapshot(img, p.serial);
}

// requestSnapshot fetches one frame and prevents overlapping tile captures.
function requestSnapshot(img, serial) {
  if (img.dataset.pending === "true") return;
  img.hidden = false;
  img.closest(".cam").querySelector(".msg").textContent = "";
  img.dataset.snapshotError = "false";
  img.dataset.mode = "snapshot";
  img.dataset.serial = serial;
  img.dataset.pending = "true";
  const bust = Date.now();
  img.dataset.bust = String(bust);
  img.src = `/camera/${encodeURIComponent(serial)}/snapshot?t=${bust}`;
}

// pauseImage releases the MJPEG connection when a tile leaves the live set.
function pauseImage(img) {
  if (img.dataset.mode !== "paused") img.removeAttribute("src");
  img.dataset.mode = "paused";
  img.dataset.serial = "";
  img.dataset.pending = "false";
}

// refreshSnapshots honors the configured cadence without refreshing printer
// state or restarting any live stream.
function refreshSnapshots() {
  const now = Date.now();
  for (const serial of snapshotSlots) {
    const tile = document.querySelector(`[data-serial="${CSS.escape(serial)}"]`);
    const img = tile?.querySelector("img");
    if (!img || img.dataset.mode !== "snapshot" || img.dataset.pending === "true") continue;
    if (now - Number(img.dataset.bust || 0) >= snapshotInterval * 1000) requestSnapshot(img, serial);
  }
}

// Browser image events release the pending marker so the next interval can
// request another frame or retry a failed snapshot.
function settleSnapshot(event) {
  const img = event.currentTarget;
  if (img.dataset.mode === "snapshot") {
    img.dataset.pending = "false";
    img.dataset.snapshotError = "false";
    img.closest(".cam").querySelector(".msg").textContent = "";
  }
}

// Assign limited live slots, then use snapshots for other visible cameras.
function updateModes() {
  const eligible = wallPrinters.filter(p => visibleSerials.has(p.serial) && p.connected && p.camera_supported);
  const eligibleSerials = new Set(eligible.map(p => p.serial));
  const nextLive = new Set([...liveSlots].filter(serial => eligibleSerials.has(serial)).slice(0, maxLive));
  const active = p => ["RUNNING", "PAUSE"].includes((p.state || "").toUpperCase());
  // Keep current eligible streams first; use free slots for active prints, then wall order.
  for (const p of [...eligible.filter(active), ...eligible.filter(p => !active(p))]) {
    if (nextLive.size >= maxLive) break;
    nextLive.add(p.serial);
  }
  liveSlots = nextLive;
  snapshotSlots = new Set();
  for (const p of wallPrinters) {
    p.mode = !p.camera_supported ? "unsupported" : !p.connected ? "offline" : "paused";
    if (!visibleSerials.has(p.serial) || !p.connected || !p.camera_supported) continue;
    if (liveSlots.has(p.serial)) p.mode = "live";
    else { p.mode = "snapshot"; snapshotSlots.add(p.serial); }
  }
  updateTiles(wallPrinters);
  const live = wallPrinters.filter(p => p.mode === "live").length;
  const snap = wallPrinters.filter(p => p.mode === "snapshot").length;
  const counts = state => wallPrinters.filter(p => (p.state || "").toUpperCase() === state).length;
  const offline = wallPrinters.filter(p => !p.connected).length;
  const summary = wallPrinters.length === 0 ? "No printers configured" :
    `${wallPrinters.length} printers · ${live} live · ${snap} snapshots · ` +
    `${counts("RUNNING")} running · ${counts("PAUSE")} paused · ${counts("PREPARE") + counts("SLICING")} preparing · ${counts("FAILED")} failed · ${offline} offline`;
  if (summary !== lastSummary) document.getElementById("summary").textContent = lastSummary = summary;
}

// Track on-screen tiles so off-screen cameras release their connections.
function observeTiles() {
  if (!("IntersectionObserver" in window)) {
    for (const p of wallPrinters) visibleSerials.add(p.serial);
    updateModes();
    return;
  }
  if (!visibilityObserver) visibilityObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const serial = entry.target.dataset.serial;
      if (!serial) continue;
      if (entry.isIntersecting) visibleSerials.add(serial);
      else visibleSerials.delete(serial);
    }
    updateModes();
  }, { threshold: 0.4 });
  document.querySelectorAll(".tile:not([data-observed])").forEach(tile => {
    tile.dataset.observed = "true";
    visibilityObserver.observe(tile);
  });
}

// Keep tile nodes and their image elements stable as state changes.
function updateTiles(printers) {
  for (const p of printers) {
    const tile = document.querySelector(`[data-serial="${CSS.escape(p.serial)}"]`);
    if (tile) update(tile, p);
  }
}

// Fetch printer state and announce only changes in request health.
async function poll() {
  if (inFlight) return;              // never overlap status requests
  inFlight = true;
  try {
    const res = await fetch("/camera/status", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data.printers)) throw new Error("invalid status response");

    lastSuccessAt = new Date();
    document.getElementById("updated").textContent = `Last successful update: ${lastSuccessAt.toLocaleTimeString()}`;
    if (requestFailed) {
      const notice = document.getElementById("request-error");
      notice.textContent = "Status requests recovered.";
      notice.classList.add("recovered");
      notice.hidden = false;
      requestFailed = false;
    }

    const grid = document.getElementById("grid");
    const printers = data.printers;
    wallPrinters = printers;
    grid.hidden = printers.length === 0;
    document.getElementById("empty").hidden = printers.length !== 0;

    const bySerial = new Map(printers.map(p => [p.serial, p]));
    let added = false;
    let removed = false;
    for (const el of [...grid.children]) {
      if (!bySerial.has(el.dataset.serial)) {
        visibilityObserver?.unobserve(el);
        delete el.dataset.observed;
        visibleSerials.delete(el.dataset.serial);
        el.remove();
        removed = true;
      }
    }
    for (const p of printers) {
      if (grid.querySelector(`[data-serial="${CSS.escape(p.serial)}"]`)) continue;
      grid.appendChild(render(p));
      added = true;
    }
    if (added || removed || !visibilityObserver) observeTiles();
    updateModes();
  } catch (error) {
    if (!requestFailed) {
      const detail = error instanceof Error ? error.message : "network or response error";
      const notice = document.getElementById("request-error");
      notice.classList.remove("recovered");
      notice.textContent = lastSuccessAt
        ? `Status request failed (${detail}); showing the last successful data.`
        : `Status request failed (${detail}); no successful status data yet.`;
      notice.hidden = false;
      requestFailed = true;
    }
  }
  finally { inFlight = false; }
}

setInterval(poll, STATUS_POLL_MS);
setInterval(refreshSnapshots, SNAPSHOT_TICK_MS);
poll();
</script>
</body>
</html>
