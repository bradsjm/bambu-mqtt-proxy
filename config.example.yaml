# bambu-mqtt-proxy example configuration.
# Copy to bambu-mqtt-proxy.yaml and edit the printers section.
# The YAML file is the configuration; only BMBPX_HTTP_PORT (http.port) and
# BMBPX_LOG_LEVEL (log.level) override it. Every setting is editable on the
# /config page; saving writes this file and restarts the proxy. A removed
# `behavior` section in an old file is ignored.

listen:
  # Default: the port every Bambu app expects. TLS with a self-signed
  # certificate that is generated here on first start (clients skip
  # verification, as they do against the printer).
  - port: 8883
    tls: true
    cert_file: ./certs/proxy.crt
    key_file: ./certs/proxy.key
  # Optional extra listener for custom dashboards:
  # - port: 1883
  #   tls: false

auth:
  # printer:     require username bblp and a password matching any
  #              configured access code (recommended).
  # accept_all:  allow any CONNECT.
  mode: printer

# One entry per printer. The serial routes MQTT traffic: clients talk to
# device/{serial}/report and device/{serial}/request, or to
# device/{alias}/... when an alias is set. The raw camera endpoint
# on port 6000 instead routes by the access code, so each printer needs its
# own code.
printers:
  - serial: "01P00A123456789"
    name: "Garage P1S" # optional friendly label for the camera wall; never used for routing
    # model: "P1S" # optional; camera support is auto-detected from the serial prefix
    # alias: 01P00A987654321 # optional, blank by default; downstream clients must use it instead of the real serial, which is refused
    address: "192.168.1.42:8883"
    tls: true
    insecure_skip_verify: true
    username: "bblp"
    password: "12345678"
    # Optional accessory modules, each addressed on the local network:
    # panda_breath: panda-breath-blue.iot # Panda Breath host or IP (optional :port); chamber temperature
    # panda_pwr: 192.168.4.1 # Panda PWR host or IP (optional :port); printer power draw
  # Non-standard endpoint (custom firmware or fronting relay):
  # - serial: "01P00A987654321"
  #   address: "192.168.1.43:1883"
  #   tls: false
  #   username: "bblp"
  #   password: "87654321"

http:
  # Shared HTTP port for health, /config, the camera wall, and MCP. HTTP is
  # always on. 0 means unset: the proxy uses 8080 and logs a warning.
  port: 8080

camera:
  # Enabled by default; false removes the camera routes, the camera wall,
  # and the raw camera listener on port 6000.
  # enabled: false

mcp:
  # MCP (Model Context Protocol) endpoint on the shared HTTP port at /mcp:
  # list_printers, get_printer_state, get_camera_snapshot, watch_printer, and
  # five control tools: pause, resume, stop, chamber light, and speed
  # profile. It has no heater or temperature control. On by default; set
  # false to disable.
  # enabled: false

notifications:
  # Optional print alerts to one Pushover account (https://pushover.net/):
  # completions, failures and stops, printer errors and HMS warnings, AI
  # detection alerts, and pauses that leave an active alert. Also editable
  # on the /config page, where credentials are write-only: a blank value
  # keeps the stored one.
  # enabled: true
  # provider: pushover
  # pushover:
  #   app_token: "your-pushover-app-token"
  #   user_key: "your-pushover-user-key"

safety:
  # Optional over-temperature stop, a best-effort backup to the printer's own
  # thermal protection. When a printer's nozzle, bed, or chamber reaches its
  # model's safety limit, the proxy stops every printer, switches that
  # printer's Panda PWR off when panda_pwr is set, and sends one Pushover
  # emergency alert. Requires the Pushover credentials above, even while
  # notifications are disabled. Also a switch on the /config page.
  # enabled: true

log:
  level: info # debug logs per-packet routing decisions

# Optional build-plate check (also editable on the /config page). One
# fresh snapshot is uploaded when a print starts and `stop` is sent only
# when the plate looks occupied. The nested first-layer phase is on by
# default: two more frames are uploaded and the proxy may pause once when
# the first layer looks defective. Best effort: errors let the print continue.
# platecheck:
#   enabled: true            # default: on when the account/endpoint and api_key are set
#   provider: cloudflare     # cloudflare or custom
#   account_id: ""           # cloudflare: 32 hex characters
#   endpoint: ""             # custom: full HTTPS URL
#   api_key: ""              # write-only on the /config page
#   model: clef              # cloudflare: clef or clef-flash; custom: any name
#   stop_confidence: 0.5     # 0.50-0.99; stop above this occupied probability
#   min_clarity: 0.7         # 0.50-0.99; both checks judge only at or above this image clarity
#   first_layer:             # runs whenever the plate check is on
#     enabled: true          # false disables the first-layer phase alone
#     pause_confidence: 0.7  # 0.50-0.99; pause above this defect probability
